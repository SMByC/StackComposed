[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stack-composed"
dynamic = ["version"]
description = "Compute statistics over a stack of spatially overlapping raster images (e.g. Landsat time series)"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Xavier C. Llano", email = "xavier.corredor.llano@gmail.com" },
]
keywords = ["stack", "composed", "statistics", "landsat", "raster", "gis", "remote sensing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "rasterio",
    "dask",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/SMByC/StackComposed"
Documentation = "https://github.com/SMByC/StackComposed#readme"
"Issue Tracker" = "https://github.com/SMByC/StackComposed/issues"
Source = "https://github.com/SMByC/StackComposed"

[project.scripts]
stack-composed = "stack_composed:cli"

[tool.setuptools.dynamic]
version = { attr = "core.__version__" }

[tool.setuptools]
py-modules = ["stack_composed"]

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
